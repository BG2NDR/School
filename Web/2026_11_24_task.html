<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        ul {
            list-style-type: disc;
            padding-left: 20px;
        }
        li {
            margin-bottom: 10px;
        }
        ul{
            width: 100%;
            border: 1px solid #ccc;
            margin: 0;
            list-style: none;
        }
        li{
            width: 100%;
            padding: 10px;
            margin-right: 10px;
            background-color: #f9f9f9;
            display: flex;
        }
        li img{
            width: 50px;
            height: 50px;
            margin-right: 10px;
        }
        li a{
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        li p{
            margin: 0;
            color: #666;
        }
    </style>
</head>
<body>
    <ul>
        <li>
            <a href="https://www.example.com/article1">
                <img src="https://via.placeholder.com/50" alt="Article 1">
                Article 1
            </a>
            <p>This is a simple description for Article 1.</p>
        </li>
    </ul>
</body>
</html>
